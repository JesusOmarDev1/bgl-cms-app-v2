name: 🚀 Solicitud de Feature
description: Una funcionalidad nueva o una mejora a algo existente
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Contanos el problema antes que la solución: ayuda a validar si vale la pena y de qué lado atacarlo.

  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
      description: ¿Qué no podés hacer hoy o qué te complica? Sin proponer solución todavía.
      placeholder: "Hoy para X hay que hacer Y manualmente, y eso..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta
      description: Cómo la imaginás funcionando. Una descripción simple alcanza.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Páginas / Rutas
        - Bloques CMS
        - UI / Componentes
        - API / Servicios
        - SEO / Rendimiento
        - Storybook / Design System
        - Infraestructura / CI
        - Otro
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto extra (opcional)
      description: Referencias, mockups o ejemplos de otros sitios que hagan lo que buscás.
    validations:
      required: false
