name: 🐛 Reporte de Bug
description: Un bug reproducible o comportamiento inesperado
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Completá lo mínimo para poder reproducir el bug. Si podés, pegá también el error de consola o el stack trace.

  - type: textarea
    id: description
    attributes:
      label: ¿Qué pasó?
      description: Descripción breve del bug y qué esperabas que pasara en su lugar.
      placeholder: "Ej: Al entrar a /blog el listado no carga y la consola tira un 500. Debería mostrar los posts."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Cómo reproducirlo
      description: Pasos mínimos, de uno en uno, desde `pnpm dev`.
      placeholder: |
        1. Ir a '...'
        2. Hacer click en '...'
        3. Ver el error
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Capturas, grabaciones, mensajes de error o stack trace.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Entorno (opcional)
      description: 'Solo si pensás que afecta. Ej: Windows 11, Chrome.'
    validations:
      required: false
