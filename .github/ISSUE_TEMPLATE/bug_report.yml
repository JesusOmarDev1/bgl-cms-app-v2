name: 🐛 Reporte de Bug
description: Reportá un bug reproducible o comportamiento inesperado
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por tomarte el tiempo de reportar un bug! Completá el formulario para que podamos reproducirlo y corregirlo.

  - type: textarea
    id: description
    attributes:
      label: Descripción del Bug
      description: Descripción clara y concisa del bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para Reproducir
      description: Instrucciones paso a paso para reproducir el comportamiento.
      placeholder: |
        1. Ejecutar `pnpm install`
        2. Ejecutar `pnpm run dev`
        3. Navegar a '...'
        4. Ver el error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
      description: ¿Qué esperabas que pasara?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento Actual
      description: ¿Qué pasó realmente? Incluí mensajes de error o stack traces si los tenés.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Indicá los detalles de tu entorno.
      value: |
        - OS:
        - Node.js:
        - pnpm:
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Contexto Adicional
      description: Cualquier otro contexto, capturas de pantalla o fragmentos de código que ayuden.
    validations:
      required: false
